<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none">
  <defs>
    <linearGradient id="carmineLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#C5162E"/>
    </linearGradient>
  </defs>
  <!-- Monogram Seal Left Light -->
  <rect x="6" y="10" width="70" height="70" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="41" cy="45" r="30" stroke="#991B1B" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.4"/>
  <text x="27" y="56" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#0F172A" text-anchor="middle">E</text>
  <text x="54" y="56" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" font-style="italic" fill="url(#carmineLight)" text-anchor="middle">10</text>
  <line x1="22" y1="64" x2="60" y2="64" stroke="#991B1B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="92" y1="22" x2="92" y2="68" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Wordmark: ESPAÇO in Luxury Serif -->
  <text x="110" y="51" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="32" font-weight="700" fill="#0F172A" letter-spacing="6">ESPAÇO</text>
  
  <text x="316" y="51" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" font-style="italic" fill="url(#carmineLight)" letter-spacing="2">10</text>
  
  <text x="112" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="4.5">ALTA MODA • EST. 2007 • PLANALTINA-GO</text>
</svg>
