<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="luxuryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5162E"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <!-- Background Disc / Luxury Coin Emblem -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="#07080B" stroke="#252A36" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="42" stroke="#B91C1C" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Serif E -->
  <text x="32" y="65" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>

  <!-- Serif 10 in Haute Couture Carmine -->
  <text x="68" y="65" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="700" font-style="italic" fill="url(#luxuryRed)" text-anchor="middle">10</text>
  
  <!-- Subtle Jewelry Diamond Accent -->
  <polygon points="50,22 53,26 50,30 47,26" fill="#C5162E"/>
  <line x1="26" y1="76" x2="74" y2="76" stroke="#C5162E" stroke-width="1.5" stroke-linecap="round"/>
</svg>
